<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Computer Store - giỏ hàng của bạn với các sản phẩm đã chọn." />
  <title>Computer Store - Giỏ hàng</title>
  <link rel="stylesheet" href="../css/cart.css" />
</head>
<body>
  <div data-header-slot></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__heading">
          <h2>Giỏ hàng</h2>
          <a href="../index.html">Tiếp tục mua sắm</a>
        </div>

        <div class="product-grid" data-cart-items-grid>
          <article class="review-card" data-cart-review-card>
            <p>“Đơn hàng của bạn đủ điều kiện freeship nội thành và hỗ trợ trả góp 0%.”</p>
            <strong>Tóm tắt đơn hàng</strong>

            <p style="margin-top: 16px;">
              Tạm tính: <span data-cart-subtotal>0đ</span>
            </p>
            <p>
              Phí vận chuyển: <span data-cart-shipping>0đ</span>
            </p>
            <p><strong>Tổng cộng: <span data-cart-total>0đ</span></strong></p>

            <a class="btn btn--primary btn--full" href="./checkout.html" data-cart-checkout-link>
              Tiến hành thanh toán
            </a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../utils/auth-api.js"></script>
  <script src="../utils/loadHeader.js"></script>
  <script src="../utils/loadFooter.js"></script>
  <script src="../utils/cart.js"></script>
</body>
</html>
