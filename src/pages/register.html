<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký</title>
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body class="register-page">
  <div data-header-slot></div>

  <main class="auth-page auth-page__grid register-page__main">
    <section class="auth-card register-card">
      <div class="auth-card__header">
        <h1 class="auth-card__title">Đăng ký tài khoản</h1>
        <p class="auth-card__subtitle">Tạo tài khoản mới để theo dõi và quản lý thông tin mua hàng.</p>
      </div>

      <form class="auth-form register-form" data-auth-form="register" novalidate>
        <div class="form-message auth-message" data-form-message aria-live="polite" hidden></div>

        <div class="form-group">
          <label class="form-label" for="register-full-name">Họ và tên</label>
          <input
            class="form-input"
            id="register-full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="Nhập họ và tên"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email</label>
          <input
            class="form-input"
            id="register-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Nhập email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-phone">Số điện thoại</label>
          <input
            class="form-input"
            id="register-phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Nhập số điện thoại"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Mật khẩu</label>
          <input
            class="form-input"
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Xác nhận mật khẩu</label>
          <input
            class="form-input"
            id="register-confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Nhập lại mật khẩu"
            required
          />
        </div>

        <div class="form-actions">
          <button class="auth-form__submit" type="submit" data-submit-button>Đăng ký</button>
        </div>
      </form>

      <p class="auth-card__footer">
        Đã có tài khoản?
        <a href="login.html">Đăng nhập ngay</a>
      </p>
    </section>
  </main>

  <script src="../utils/auth-api.js"></script>
  <script src="../utils/loadHeader.js"></script>
 
  <script src="../utils/register.js"></script>
</body>
</html>
