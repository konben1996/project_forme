<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Computer Store - thông tin tài khoản và điều hướng nhanh." />
  <title>Computer Store - Thông tin tài khoản</title>
  <link rel="stylesheet" href="../css/account-info.css" />
</head>
<body class="account-info-page">
  <div data-header-slot></div>

  <main class="account-page" data-account-root>
    <section class="account-card account-card--main">
      <div class="account-card__title">
        <h1>Thông tin tài khoản</h1>
      </div>

      <div class="account-card__body">
        <p class="account-info__message" data-account-message aria-live="polite" hidden></p>

        <div class="account-info-list">
          <div class="account-info-row">
            <span>Họ và tên</span>
            <strong data-account-field="fullName">Chưa cập nhật</strong>
          </div>

          <div class="account-info-row">
            <span>Email</span>
            <strong data-account-field="email">Chưa cập nhật</strong>
          </div>

          <div class="account-info-row">
            <span>Số điện thoại</span>
            <strong data-account-field="phone">Chưa cập nhật</strong>
          </div>

          <div class="account-info-row">
            <span>Địa chỉ</span>
            <strong data-account-field="address">Chưa cập nhật</strong>
          </div>
        </div>

        <div class="account-actions">
          <button class="btn btn--primary" type="button" data-account-action="open-address-form">Cập nhật địa chỉ</button>
        </div>

        <section class="account-password" aria-labelledby="password-section-title">
          <div class="account-password__header">
            <h2 id="password-section-title">Đổi mật khẩu</h2>
            <p>Nhập mật khẩu hiện tại và mật khẩu mới để cập nhật tài khoản.</p>
          </div>

          <p class="account-password__message" data-password-message aria-live="polite" hidden></p>

          <form class="account-password__form" data-password-form>
            <label class="account-password__field" for="currentPassword">
              <span>Mật khẩu hiện tại</span>
              <div class="account-password__input">
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại" />
                <button class="account-password__toggle" type="button" data-password-toggle="currentPassword" aria-pressed="false" aria-label="Hiện mật khẩu hiện tại">Hiện</button>
              </div>
            </label>

            <label class="account-password__field" for="newPassword">
              <span>Mật khẩu mới</span>
              <div class="account-password__input">
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Nhập mật khẩu mới" />
                <button class="account-password__toggle" type="button" data-password-toggle="newPassword" aria-pressed="false" aria-label="Hiện mật khẩu mới">Hiện</button>
              </div>
            </label>

            <label class="account-password__field" for="confirmPassword">
              <span>Nhập lại mật khẩu mới</span>
              <div class="account-password__input">
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" />
                <button class="account-password__toggle" type="button" data-password-toggle="confirmPassword" aria-pressed="false" aria-label="Hiện mật khẩu nhập lại">Hiện</button>
              </div>
            </label>

            <div class="account-password__actions">
              <button class="btn btn--primary" type="submit">Đổi mật khẩu</button>
            </div>
          </form>
        </section>
      </div>

      <div class="address-modal" data-address-modal hidden>
        <div class="address-modal__backdrop" data-address-modal-close></div>
        <section class="address-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="address-modal-title">
          <div class="address-modal__header">
            <h2 id="address-modal-title">Cập nhật địa chỉ</h2>
            <button class="address-modal__close" type="button" data-address-modal-close aria-label="Đóng">×</button>
          </div>

          <p class="address-modal__message" data-address-modal-message aria-live="polite" hidden></p>

          <form class="address-form" data-address-form>
            <label class="address-form__field" for="addressLabel">
              <span>Nhãn địa chỉ</span>
              <input id="addressLabel" name="label" type="text" placeholder="Ví dụ: Nhà riêng" maxlength="60" />
            </label>

            <label class="address-form__field" for="addressRecipientName">
              <span>Người nhận</span>
              <input id="addressRecipientName" name="recipientName" type="text" placeholder="Nhập tên người nhận" maxlength="120" />
            </label>

            <label class="address-form__field" for="addressRecipientPhone">
              <span>Số điện thoại</span>
              <input id="addressRecipientPhone" name="recipientPhone" type="tel" autocomplete="tel" placeholder="Nhập số điện thoại" maxlength="20" />
            </label>

            <label class="address-form__field" for="addressLine">
              <span>Số nhà, tên đường</span>
              <input id="addressLine" name="addressLine" type="text" autocomplete="street-address" placeholder="Nhập địa chỉ chi tiết" maxlength="255" />
            </label>

            <div class="address-form__grid">
              <label class="address-form__field" for="addressWard">
                <span>Phường/Xã</span>
                <input id="addressWard" name="ward" type="text" placeholder="Nhập phường/xã" maxlength="120" />
              </label>

              <label class="address-form__field" for="addressDistrict">
                <span>Quận/Huyện</span>
                <input id="addressDistrict" name="district" type="text" placeholder="Nhập quận/huyện" maxlength="120" />
              </label>
            </div>

            <label class="address-form__field" for="addressProvince">
              <span>Tỉnh/Thành phố</span>
              <input id="addressProvince" name="province" type="text" placeholder="Nhập tỉnh/thành phố" maxlength="120" />
            </label>

            <label class="address-form__checkbox">
              <input type="checkbox" name="isDefault" checked />
              <span>Đặt làm địa chỉ mặc định</span>
            </label>

            <div class="address-form__actions">
              <button class="btn btn--ghost" type="button" data-address-modal-close>Hủy</button>
              <button class="btn btn--primary" type="submit">Lưu địa chỉ</button>
            </div>
          </form>
        </section>
      </div>

    </section>
  </main>

  <script src="../utils/auth-api.js"></script>
  <script src="../utils/loadHeader.js"></script>
  <script src="../utils/account-info.js"></script>
</body>
</html>
