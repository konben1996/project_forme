<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="login-page">
  <div data-header-slot></div>

  <main class="auth-page auth-page__grid login-page__main">
    <section class="auth-card login-card">
      <div class="auth-card__header">
        <h1 class="auth-card__title">Đăng nhập</h1>
        <p class="auth-card__subtitle">Chào mừng bạn quay lại với cửa hàng của chúng tôi.</p>
      </div>

      <form class="auth-form login-form" data-auth-form="login" novalidate>
        <div class="form-message auth-message" data-form-message aria-live="polite" hidden></div>

        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input
            class="auth-form__input"
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Nhập email của bạn"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <input
            class="auth-form__input"
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>

        <div class="form-actions">
          <button class="auth-form__submit" type="submit" data-submit-button>Đăng nhập</button>
        </div>
      </form>

      <p class="auth-card__footer">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
      </p>
    </section>
  </main>

  <script src="../utils/auth-api.js"></script>
  <script src="../utils/loadHeader.js"></script>
 
  <script src="../utils/login.js"></script>
</body>
</html>
