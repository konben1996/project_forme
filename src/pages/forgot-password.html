<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Computer Store - khôi phục mật khẩu tài khoản nhanh chóng và an toàn." />
  <title>Computer Store - Quên mật khẩu</title>
  <link rel="stylesheet" href="../css/forgot-password.css" />
</head>
<body>
  <div data-header-slot></div>

  <main>
    <section class="auth-page">
      <div class="container auth-page__grid">
        <div class="auth-card">
          <div class="auth-card__header">
            <h2>Quên mật khẩu</h2>
            <p>Nhập email hoặc số điện thoại để nhận hướng dẫn đặt lại mật khẩu.</p>
          </div>

          <form class="auth-form" action="#" method="post">
            <label for="account">
              Email hoặc số điện thoại
              <input id="account" type="text" name="account" autocomplete="username" placeholder="Nhập email hoặc số điện thoại" />
            </label>

            <button class="auth-form__submit" type="submit">Gửi yêu cầu</button>
          </form>

          <div class="auth-card__footer">
            Đã nhớ mật khẩu? <a href="../pages/login.html">Quay lại đăng nhập</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../utils/loadHeader.js"></script>
 
  <script src="../utils/loadFooter.js"></script>
</body>
</html>
