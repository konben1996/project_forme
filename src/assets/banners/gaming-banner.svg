<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title>Gaming banner</title>
  <desc>Blue and purple gaming banner with desktop setup, neon glow and performance cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="150" fill="url(#glow)"/>
  <circle cx="1450" cy="70" r="200" fill="#ffffff" opacity="0.06"/>
  <circle cx="1420" cy="430" r="220" fill="#ffffff" opacity="0.05"/>
  <path d="M0 400 C220 340, 410 470, 620 412 S1040 320, 1600 430 L1600 520 L0 520 Z" fill="#020617" opacity="0.22"/>
  <path d="M0 330 C260 250, 560 420, 880 310 S1340 220, 1600 300" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>

  <g filter="url(#shadow)">
    <rect x="430" y="90" width="740" height="330" rx="34" fill="#020617" opacity="0.35"/>
    <rect x="460" y="70" width="680" height="300" rx="30" fill="url(#screen)"/>
    <rect x="490" y="100" width="620" height="220" rx="24" fill="#0f172a"/>
    <circle cx="660" cy="210" r="96" fill="#38bdf8" opacity="0.14"/>
    <circle cx="950" cy="160" r="70" fill="#a855f7" opacity="0.18"/>
    <rect x="520" y="340" width="620" height="18" rx="9" fill="#020617" opacity="0.32"/>
    <path d="M560 348 L1040 348 L1088 386 H512 Z" fill="url(#board)"/>
    <rect x="770" y="396" width="70" height="10" rx="5" fill="#cbd5e1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="126" y="132" width="250" height="196" rx="26" fill="#0f172a" opacity="0.88"/>
    <rect x="154" y="160" width="194" height="66" rx="18" fill="url(#accent)"/>
    <rect x="154" y="240" width="136" height="16" rx="8" fill="#cbd5e1" opacity="0.6"/>
    <rect x="154" y="268" width="158" height="16" rx="8" fill="#cbd5e1" opacity="0.42"/>
    <rect x="154" y="296" width="118" height="16" rx="8" fill="#cbd5e1" opacity="0.32"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1234" y="150" width="202" height="224" rx="28" fill="#0f172a" opacity="0.9"/>
    <rect x="1262" y="180" width="146" height="104" rx="20" fill="#dbeafe"/>
    <path d="M1296 244 L1322 214 L1344 236 L1366 200 L1382 244 Z" fill="#1d4ed8"/>
    <circle cx="1335" cy="232" r="16" fill="#fff"/>
    <rect x="1262" y="302" width="122" height="14" rx="7" fill="#cbd5e1" opacity="0.7"/>
    <rect x="1262" y="328" width="94" height="14" rx="7" fill="#cbd5e1" opacity="0.48"/>
  </g>

  <g opacity="0.95">
    <circle cx="238" cy="84" r="7" fill="#ffffff"/>
    <circle cx="288" cy="118" r="5" fill="#ffffff" opacity="0.92"/>
    <circle cx="1320" cy="90" r="7" fill="#ffffff"/>
    <circle cx="1374" cy="124" r="5" fill="#ffffff" opacity="0.85"/>
    <circle cx="1142" cy="468" r="6" fill="#ffffff" opacity="0.75"/>
    <circle cx="1200" cy="426" r="4" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>