<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title>Computer Store banner</title>
  <desc>Abstract technology banner with laptop, desktop components and blue-purple gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="keyboard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <circle cx="120" cy="92" r="110" fill="url(#glow)"/>
  <circle cx="1460" cy="58" r="160" fill="url(#glow)"/>
  <circle cx="1380" cy="410" r="210" fill="#ffffff" opacity="0.06"/>
  <path d="M0 408 C220 360, 380 470, 630 422 S1080 330, 1600 428 L1600 520 L0 520 Z" fill="#020617" opacity="0.22"/>
  <path d="M0 360 C260 290, 520 450, 820 372 S1280 250, 1600 350" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>
  <path d="M0 314 C250 250, 560 400, 900 312 S1320 210, 1600 292" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <g filter="url(#shadow)">
    <rect x="390" y="108" width="840" height="308" rx="32" fill="#020617" opacity="0.38"/>
    <rect x="420" y="90" width="760" height="316" rx="30" fill="url(#screen)"/>
    <rect x="450" y="120" width="700" height="252" rx="22" fill="#0f172a"/>
    <path d="M450 120 H1150 L1150 182 C1040 194, 930 150, 820 164 C700 178, 600 230, 450 212 Z" fill="#dbeafe" opacity="0.12"/>
    <circle cx="1030" cy="186" r="78" fill="#ffffff" opacity="0.12"/>
    <circle cx="1080" cy="150" r="48" fill="#ffffff" opacity="0.18"/>
    <circle cx="640" cy="268" r="96" fill="#60a5fa" opacity="0.18"/>
    <rect x="430" y="402" width="740" height="20" rx="10" fill="#020617" opacity="0.32"/>
    <path d="M500 410 L1080 410 L1140 448 H440 Z" fill="url(#keyboard)"/>
    <rect x="720" y="438" width="160" height="12" rx="6" fill="#bfdbfe" opacity="0.7"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="126" y="152" width="266" height="166" rx="26" fill="url(#card)"/>
    <rect x="152" y="176" width="96" height="96" rx="18" fill="#1d4ed8"/>
    <path d="M174 246 L196 220 L216 238 L238 206 L242 246 Z" fill="#dbeafe"/>
    <rect x="272" y="182" width="94" height="16" rx="8" fill="#1e293b" opacity="0.16"/>
    <rect x="272" y="214" width="72" height="12" rx="6" fill="#1e293b" opacity="0.14"/>
    <rect x="272" y="238" width="84" height="12" rx="6" fill="#1e293b" opacity="0.14"/>
    <rect x="272" y="264" width="54" height="12" rx="6" fill="#1e293b" opacity="0.14"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1200" y="176" width="188" height="210" rx="28" fill="#0f172a" opacity="0.78"/>
    <rect x="1228" y="204" width="132" height="96" rx="18" fill="#dbeafe"/>
    <circle cx="1289" cy="252" r="25" fill="#1d4ed8"/>
    <path d="M1289 231 L1300 246 L1316 248 L1304 259 L1307 275 L1289 266 L1271 275 L1274 259 L1262 248 L1278 246 Z" fill="#ffffff"/>
    <rect x="1238" y="316" width="112" height="14" rx="7" fill="#bfdbfe" opacity="0.8"/>
    <rect x="1238" y="342" width="84" height="14" rx="7" fill="#bfdbfe" opacity="0.6"/>
  </g>

  <g opacity="0.9">
    <circle cx="240" cy="78" r="8" fill="#ffffff"/>
    <circle cx="286" cy="110" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="1268" cy="72" r="7" fill="#ffffff"/>
    <circle cx="1320" cy="116" r="5" fill="#ffffff" opacity="0.85"/>
    <circle cx="1490" cy="170" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="1090" cy="468" r="6" fill="#ffffff" opacity="0.75"/>
    <circle cx="1140" cy="424" r="4" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>